bundle:
  name: genie_smart_router
  engine: direct

variables:
  app_name:
    description: Workspace-global name of the router app
    default: genie-router-${workspace.current_user.domain_friendly_name}
  memory_volume:
    description: Unity Catalog volume containing manually selected memory events
  memory_pipeline_id:
    description: Pipeline to run when the signed-in user clicks Distill memory
  shared_memory_storage:
    description: Show an explicit shared-storage warning before publication
    default: "false"
  model:
    description: Unity Catalog model service the agent calls through Unity AI 
      Gateway
    default: "system.ai.gpt-6-luna"
  router_model:
    description: Small System One model that routes each turn to a Genie agent
    default: "system.ai.openjev-qwen35-4b"
  model_router:
    description: Unity Gateway routing API router name (task_v2); any other value disables
      model routing so every turn uses ${var.model} — used for A/B cost baselines
    default: "task_v2"
  # Genie agents (scripts/create_genie_agents.py); ids are written by the script or set here
  tpch_genie_space_id:
    description: Genie space of the TPC-H Order Analytics agent
    default: ""
  nyc_taxi_genie_space_id:
    description: Genie space of the NYC Taxi Trips agent
    default: ""

  genie_dataset:
    default: asana
sync:
  exclude:
    # pyproject.toml / uv.lock point at the internal PyPI proxy, which Apps can't reach —
    # the app installs from requirements.txt instead.
    - pyproject.toml
    - scripts/**
    - README.md

resources:
  apps:
    genie_smart_router:
      name: ${var.app_name}
      description: "Genie agents with AI Gateway smart routing and the openjev Genie
        router"
      source_code_path: ./
      # on-behalf-of user auth: forward the user's token (x-forwarded-access-token) for Genie
      # MCP. `genie` is the scope the managed Genie MCP server requires. After changing
      # scopes, users must sign in to the app again (a fresh browser session) to get a token
      # with the new scopes.
      user_api_scopes:
        - genie
        - mcp.genie
      config:
        command: ["python", "app.py"]
        env:
          - name: MODEL
            value: ${var.model}
          - name: ROUTER_MODEL
            value: ${var.router_model}
          - name: MODEL_ROUTER
            value: ${var.model_router}
          # services whose Unity Gateway rate limit is 0 in this workspace (every call is 403)
          - name: MODEL_EXCLUDE
            value: "system.ai.claude-opus-4-8,system.ai.gpt-5-5"
          - name: LAKEBASE_ENDPOINT
            value_from: agent_memory_postgres
          - name: LONG_TERM_MEMORY_VOLUME
            value_from: memory_events
          - name: LONG_TERM_MEMORY_PIPELINE_ID
            value: ${var.memory_pipeline_id}
          - name: LONG_TERM_MEMORY_AUTO_EXPORT
            value: "false"
          - name: LONG_TERM_MEMORY_SHARED_STORAGE
            value: ${var.shared_memory_storage}

          - name: GENIE_DATASET
            value: ${var.genie_dataset}
          - name: GENIE_CUSTOM_CLAIMS
            value: 'true'
          - name: ASANA_REVENUE_GENIE_SPACE_ID
            value_from: asana_revenue_genie
          - name: ASANA_MARKETING_GENIE_SPACE_ID
            value_from: asana_marketing_genie
      resources:
        - name: memory_events
          uc_securable:
            securable_full_name: ${var.memory_volume}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: agent_memory_postgres
          postgres:
            branch: 
              projects/genie-smart-router-memory/branches/smart-router-memory
            database: 
              projects/genie-smart-router-memory/branches/smart-router-memory/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: asana_revenue_genie
          genie_space:
            name: Membership Revenue
            space_id: 01f1d744b923143ba9ca9674f24b978b
            permission: CAN_RUN
        - name: asana_marketing_genie
          genie_space:
            name: Marketing Campaigns
            space_id: 01f1d744b9f31c018966ce4acb1b42ac
            permission: CAN_RUN
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-workshop-guy.cloud.databricks.com
