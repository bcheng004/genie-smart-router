[project]
name = "genie-smart-router"
version = "0.1.0"
description = "Genie agents with AI Gateway smart routing and the openjev Genie router"
requires-python = ">=3.10"
dependencies = [
    "dash",
    "dash-bootstrap-components",
    "databricks-sdk",
    "openai-agents",
    "databricks-openai",
    "psycopg[binary]",
]

[project.scripts]
create-genie-agents = "scripts.create_genie_agents:main"
generate-asana-data = "scripts.generate_asana_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "claims_auth"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
index-url = "https://pypi-proxy.dev.databricks.com"

[dependency-groups]
# local tooling only (scripts/), not installed in the app
dev = ["ruamel.yaml"]
